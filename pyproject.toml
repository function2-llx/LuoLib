[project]
description = "Personal Python library specifically for Medical Image Analysis research"
name = "LuoLib"
requires-python = ">= 3.12"
version = "0.1.0"
dependencies = ["jsonargparse[omegaconf]"]

[tool.pixi.system-requirements]
cuda = "12"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
cytoolz = "*"
numpy = "*"
einops = "*"
pytorch = "2.*"
torchvision = "*"
timm = "*"
lightning = "*"
wandb = "*"
pandas = "*"
matplotlib = "*"
simpleitk = "*"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.pypi-dependencies]
luolib = { path = ".", editable = true }

[tool.pixi.tasks]
