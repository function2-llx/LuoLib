[tool.pixi.dependencies]
cytoolz = "*"
numpy = "*"
einops = "*"
pytorch = "*"
torchvision = "*"
timm = "*"
lightning = "*"
wandb = "*"
pandas = "*"
matplotlib = "*"
simpleitk = "*"

[build-system]
build-backend = "hatchling.build"
